name: Windows build

# Shows the Windows version still builds. It proves nothing about Bluetooth
# or the app running on a real PC.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/windows-build.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release
