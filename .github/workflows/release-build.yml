name: Release build

# Builds the files for a release: an Android APK and a macOS zip, with
# SHA-256 checksums. Publishing to notoryx-core-independent-releases is done
# from those artifacts.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release-build.yml
      - android/app/build.gradle.kts

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Release signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing; a release build needs the real key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      # A tag build names the app after its tag (v0.1.0-test.15 gives
      # 0.1.0-test.15), so update checkers such as Obtainium see the
      # installed version match the release. Other builds keep pubspec's.
      - name: Version name
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "BUILD_NAME=--build-name=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      # The phone build first: the full build below overwrites the output.
      # Same version code as the full one, so people can switch freely.
      - name: Phone-only APK (64-bit ARM, most phones since 2017)
        run: |
          flutter build apk --release --target-platform android-arm64 $BUILD_NAME
          cp build/app/outputs/flutter-apk/app-release.apk app-arm64.apk
      - run: flutter build apk --release $BUILD_NAME

      - name: Check the version name
        run: |
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-release.apk app-arm64.apk; do
            "$aapt" dump badging "$apk" | grep -o "versionCode='[0-9]*' versionName='[^']*'"
          done
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            "$aapt" dump badging app-arm64.apk | grep -q "versionName='${GITHUB_REF_NAME#v}'" || {
              echo "::error::versionName does not match the tag"
              exit 1
            }
          fi

      - name: Play bundle (obfuscated, symbols saved)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols $BUILD_NAME

      - name: Check the APK signer
        env:
          SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          # Public fingerprint of the NOTORYX Independent release certificate.
          EXPECTED: 2a3e26c01231a764fb398ef4fd844f8a0b782228013b1aba5a10c41ac3500924
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-release.apk app-arm64.apk; do
            "$apksigner" verify --print-certs "$apk" | tee signer.txt
            if [ "$SIGNED" = "true" ] && ! grep -qi "SHA-256 digest: $EXPECTED" signer.txt; then
              echo "::error::$apk is not signed with the NOTORYX Independent release key"
              exit 1
            fi
          done

      - name: Check the Play bundle
        env:
          EXPECTED: 2a3e26c01231a764fb398ef4fd844f8a0b782228013b1aba5a10c41ac3500924
        run: |
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          target=$("$aapt" dump badging app-arm64.apk | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")
          echo "targetSdk=$target"
          if [ "${target:-0}" -lt 36 ]; then
            echo "::error::Google Play needs target API 36 or higher; this build targets $target"
            exit 1
          fi
          want=$(echo "$EXPECTED" | tr a-f A-F | sed 's/../&:/g; s/:$//')
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | tee bundle-signer.txt
          grep -q "SHA256: $want" bundle-signer.txt || {
            echo "::error::The Play bundle is not signed with the release key"
            exit 1
          }

      - name: Name and checksum the APK
        run: |
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          mkdir dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/NOTORYX-Independent-$version-android.apk"
          cp app-arm64.apk "dist/NOTORYX-Independent-$version-android-arm64.apk"
          cd dist && sha256sum *.apk > SHA256SUMS-android.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          retention-days: 90
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Zip and checksum the app
        shell: bash
        run: |
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          mkdir dist
          name="NOTORYX-Independent-$version-windows.zip"
          pwsh -Command "Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/$name"
          cd dist && sha256sum "$name" > SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  macos:
    # Apple-silicon runners were out of capacity for hours; the Intel image
    # still builds a universal (Intel and Apple silicon) app.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get
      - run: flutter build macos --release

      - name: Zip and checksum the app
        run: |
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          mkdir dist
          ditto -c -k --keepParent "build/macos/Build/Products/Release/NOTORYX Independent.app" \
            "dist/NOTORYX-Independent-$version-macos.zip"
          cd dist && shasum -a 256 *.zip > SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/
