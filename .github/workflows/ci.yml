name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  independence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch meshcore-open for comparison
        run: git clone --depth 1 https://github.com/zjs81/meshcore-open.git "$RUNNER_TEMP/meshcore-open"

      - name: Check for meshcore-open code
        run: python3 -I tools/check_independence.py "$RUNNER_TEMP/meshcore-open" .
