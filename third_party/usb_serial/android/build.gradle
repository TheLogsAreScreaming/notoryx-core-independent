// Vendored from usb_serial 0.5.2 (BSD-3, see ../LICENSE). Changed for current
// Android Gradle Plugin: jcenter() removed (gone from Gradle), the plugin's
// own AGP 4.1 classpath dropped in favour of the app's, newer SDK levels.
group 'dev.bessems.usbserial'
version '1.0'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'dev.bessems.usbserial'
    compileSdk 35

    defaultConfig {
        minSdk 21
    }
    lint {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.felHR85:UsbSerial:6.1.0'
}
